name: Deploy to Vercel (Production)

# 取代 Vercel GitHub App 的自動部署，避免 webhook 偶發漏接導致 push 後沒部署。
# push 到 main 一律由這條 workflow 用 Vercel CLI 建置並部署到 production。

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 允許在 GitHub Actions 頁面手動觸發

# 同分支新的部署會取消進行中的舊部署，避免競態覆蓋
concurrency:
  group: vercel-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "已部署: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 保險：明確把這次部署 promote 成 Current Production，避免它停在 Staged
      # 導致 push+build 成功但正式網址沒更新。deploy --prod 正常時此步會回 409
      # (已是 current)，屬預期，視為成功；只有其他錯誤才讓 job 失敗。
      - name: Promote to production (current)
        run: |
          set +e
          # token 只授權給 team 時，promote 不帶 --scope 會用個人帳號查而回 "User not found (404)"
          out=$(vercel promote "${{ steps.deploy.outputs.url }}" --scope=$VERCEL_ORG_ID --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then exit 0; fi
          if echo "$out" | grep -qi "already the current production"; then
            echo "(此部署已是 current production，無需 promote)"; exit 0
          fi
          echo "promote 失敗"; exit $code
